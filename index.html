<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Portal | User Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="user-body">

  <div class="user-wrapper">
    
    <!-- 1. Register Box -->
    <div id="register-box" class="glass-card">
      <div class="card-header">
        <span class="header-icon">📝</span>
        <h2>Account Register Karein</h2>
        <p>Quiz mein bhag lene ke liye apni details bharein</p>
      </div>

      <div class="form-group">
        <label>Pura Naam</label>
        <input type="text" id="reg-name" placeholder="Apna naam daalein">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="reg-mobile" placeholder="10-digit mobile number" maxlength="10">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Naya password banayein">
      </div>

      <button onclick="registerUser()" class="btn-primary">Register Karein 🚀</button>
      <p class="switch-auth">Pehle se account hai? <a href="#" onclick="showLogin()">Login Karein</a></p>
    </div>

    <!-- 2. Login Box -->
    <div id="login-box" class="glass-card" style="display: none;">
      <div class="card-header">
        <span class="header-icon">🔐</span>
        <h2>User Login</h2>
        <p>Apna mobile number aur password daalein</p>
      </div>

      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="login-mobile" placeholder="Registered mobile number" maxlength="10">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Apna password daalein">
      </div>

      <button onclick="loginUser()" class="btn-primary">Login & Start Quiz ⚡</button>
      <p class="switch-auth">Naya account banayein? <a href="#" onclick="showRegister()">Register Karein</a></p>
    </div>

    <!-- 3. Active Quiz Box (Timer, Options & Next Button) -->
    <div id="quiz-box" class="glass-card quiz-card" style="display: none;">
      <div class="quiz-topbar">
        <span id="question-count" class="badge-count">Question 1 of 5</span>
        <span id="timer-text" class="badge-timer">⏱️ Time: 15s</span>
      </div>

      <div class="question-container">
        <h2 id="question-text">Loading question...</h2>
      </div>

      <div id="options-container" class="options-grid"></div>

      <!-- Next Question Button (Initially Hidden) -->
      <button id="next-btn" onclick="nextQuestion()" class="btn-primary" style="display: none; margin-top: 20px;">Agle Question par Jayein ➡️</button>
    </div>

    <!-- 4. Result Box (Score & Detailed Review Section) -->
    <div id="result-box" class="glass-card result-card" style="display: none;">
      <div class="card-header">
        <span class="header-icon">🏆</span>
        <h2>Quiz Result</h2>
      </div>

      <div class="result-details">
        <p id="user-display-name" class="res-user"></p>
        <p id="user-display-mobile" class="res-mobile"></p>
        <div class="score-circle">
          <span id="score-text">0 / 0</span>
        </div>
      </div>

      <!-- Question Review Container (script.js se dynamically manage hoga) -->
      <div id="quiz-review-section" style="margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>

      <button onclick="location.reload()" class="btn-primary" style="margin-top: 20px;">Dobara Attempt Karein 🔄</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
